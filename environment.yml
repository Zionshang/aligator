name: aligator-dev
channels:
  - conda-forge
  - nodefaults
dependencies:
  # ==========================================
  # 构建工具与编译器 (Build tools & Compilers)
  # ==========================================
  - cmake >=3.22
  - ccache >=4.9.1
  - ninja >=1.0.0
  - cxx-compiler >=1.7.0
  - pkg-config >=0.29.2

  # ==========================================
  # 核心 C++ 与 Python 依赖 (Core dependencies)
  # ==========================================
  - python =3.10
  - libboost-devel >=1.86.0,<2
  - libboost-python-devel >=1.86.0,<2
  - eigen >=3.4.0,<4
  - eigenpy >=3.12.0
  - fmt >=11.1.4
  - mimalloc >=3.1.5,<4
  
  # ==========================================
  # 机器人学相关库 (Robotics libraries)
  # ==========================================
  - pinocchio >=3.8.0
  - crocoddyl >=3.0.1
  - example-robot-data-loaders >=4

  # ==========================================
  # 测试与基准测试 (Testing & Benchmarking)
  # ==========================================
  - benchmark >=1.9.4,<2
  - catch2 >=3.8.0,<4
  - pytest >=8.3.5,<9

  # ==========================================
  # Python 工具与可视化 (Python Utils & Viz)
  # ==========================================
  - pybind11
  - matplotlib-base >=3.9.4,<4
  - typed-argument-parser >=1.10.1,<2
  - meshcat-python >=0.3.2,<0.4

  # ==========================================
  # 文档与代码规范 (Docs & Linting)
  # ==========================================
  - doxygen >=1.13
  - graphviz >=12
  - pre-commit >=4.3.0
  - tomlkit >=0.13.2

  # ==========================================
  # 性能分析 Tracy
  # ==========================================
  - capstone
  - tracy